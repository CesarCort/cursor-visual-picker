<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cursor Element Picke</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 14px; width: 320px; }
      label { display:block; margin-top: 10px; font-weight: 600; }
      label.row { margin-top: 0; }
      input[type="text"], textarea { width: 100%; box-sizing: border-box; }
      .row { display: flex; align-items: center; gap: 8px; }
      .column { display:flex; flex-direction:column; gap:4px; }
      .btn { margin-top: 10px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }
      .shortcut-hint { font-size: 12px; color: #555; }
      .deeplink-toggle { margin-left: auto; gap: 6px; font-weight: 500; }
      .helper-text { margin-top: 12px; font-size: 12px; color: #444; line-height: 1.4; }
    </style>
  </head>
  <body>
    <h3>Cursor Element Picker</h3>
    <div class="row">
      <div class="column">
        <button id="pick" class="btn">🎯 Seleccionar elemento</button>
        <span class="shortcut-hint">Atajo: ⌘⇧Y / Ctrl+Shift+Y</span>
      </div>
      <label class="row deeplink-toggle">
        <input type="checkbox" id="useDeeplink" />
        Deeplink a Cursor
      </label>
    </div>
    <p class="helper-text">
      Activa el selector desde aquí, con el atajo o haciendo clic derecho sobre la página y eligiendo “Cursor: Seleccionar elemento”.
    </p>

    <label for="endpoint">Endpoint del servidor</label>
    <input type="text" id="endpoint" />

    <label for="extraPrompt">Prompt adicional</label>
    <textarea id="extraPrompt" rows="3"></textarea>

    <button id="save" class="btn">Guardar configuración</button>

    <script src="popup.js"></script>
  </body>
</html>
